<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Boyfriend Mode · Player 2 Has Entered the Chat</title>
  <meta name="description" content="He is too busy playing GTA? Make him a GTA-style game where every mission is you." />
  <link rel="icon" type="image/svg+xml" href="/heart.svg" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="rotate"><div class="phone"></div><b>Turn your phone sideways</b><span>Boyfriend Mode plays in landscape</span></div>
  <div id="splash">
    <div class="splash-inner">
      <div class="logo">
        <div class="l1">PLAYER 2</div>
        <div class="l2">BOYFRIEND</div>
        <div class="l3">MODE</div>
      </div>
      <div class="presented"><span>PUT THE CONTROLLER DOWN. SHE HAS MISSIONS.</span></div>
      <div class="kicker">SHE MADE THIS GAME FOR YOU</div>
      <button id="start" class="primary big" disabled>PRESS START</button>
      <div class="loading" id="loading">Loading...</div>
    </div>
    <div class="splash-foot"><a href="/">Make one for your boyfriend</a></div>
  </div>
  <aside id="creator" class="hidden"></aside>
  <div id="hud" class="hidden"></div>
  <script type="module" src="/src/entry.js"></script>
</body>
</html>
